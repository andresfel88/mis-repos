<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Producto — Estilo Apple</title>
  
  <style>
    /* Reset básico y sistema de fuentes nativas de Apple */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: #000000;
      color: #f5f5f7;
      overflow-x: hidden;
    }

    /* Barra de Navegación con Efecto Vidrio Esmerilado */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 44px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 9999;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-container {
      max-width: 1024px;
      margin: 0 auto;
      height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 22px;
    }

    .logo {
      color: #f5f5f7;
      text-decoration: none;
      font-size: 18px;
    }

    .nav-links a {
      color: rgba(245, 245, 247, 0.8);
      text-decoration: none;
      font-size: 12px;
      margin-left: 24px;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
    }

    /* Hero Section (Sección Principal) */
    .hero {
      padding-top: 140px;
      padding-bottom: 80px;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tagline {
      color: #f56300;
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .title {
      font-size: 56px;
      line-height: 1.07;
      font-weight: 600;
      letter-spacing: -0.005em;
      max-width: 700px;
      background: linear-gradient(180deg, #ffffff 0%, #86868b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 28px;
      line-height: 1.14;
      font-weight: 400;
      color: #86868b;
      margin-top: 15px;
      margin-bottom: 28px;
    }

    /* Botones Estilo Apple */
    .cta-group {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .btn {
      font-size: 17px;
      border-radius: 980px;
      padding: 11px 21px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background-color: #0071e3;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #0077ed;
    }

    .btn-secondary {
      color: #2997ff;
    }

    .btn-secondary:hover {
      text-decoration: underline;
    }

    /* Contenedor Visual del Producto */
    .product-preview {
      margin-top: 50px;
      width: 320px;
      height: 420px;
      border-radius: 40px;
      background: #161617;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .glow-effect {
      position: absolute;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(41,151,255,0.35) 0%, rgba(0,0,0,0) 70%);
      filter: blur(30px);
    }

    .product-text {
      color: #86868b;
      font-size: 14px;
      z-index: 1;
    }

    /* Adaptación para pantallas móviles */
    @media (max-width: 734px) {
      .title {
        font-size: 40px;
        padding: 0 20px;
      }
      .subtitle {
        font-size: 21px;
        padding: 0 20px;
      }
      .nav-links a {
        margin-left: 12px;
        font-size: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Navegación -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="logo"></a>
      <div class="nav-links">
        <a href="#">Tienda</a>
        <a href="#">Mac</a>
        <a href="#">iPad</a>
        <a href="#">iPhone</a>
        <a href="#">Soporte</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <p class="tagline">Nuevo</p>
      <h1 class="title">Titanio. Tan fuerte. Tan ligero. Tan Pro.</h1>
      <p class="subtitle">El diseño más refinado que jamás hayas visto.</p>
      
      <div class="cta-group">
        <a href="#" class="btn btn-primary">Comprar</a>
        <a href="#" class="btn btn-secondary">Más información &gt;</a>
      </div>
    </div>

    <!-- Espacio para la imagen o demo de tu producto -->
    <div class="product-preview">
      <div class="glow-effect"></div>
      <p class="product-text">[ Coloca la imagen de tu producto aquí ]</p>
    </div>
  </section>

</body>
</html>
